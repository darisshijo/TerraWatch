<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraWatch Pro - Early Warning System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Navigation Header -->
    <div class="flex justify-between items-center glass p-4 rounded-xl">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">TerraWatch Pro</h1>
        <p class="text-xs text-slate-400">Landslide Early Warning & Telemetry System</p>
      </div>
      <a href="admin.html" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Admin Portal</a>
    </div>

    <!-- Alert Banner -->
    <div id="alertBanner" class="hidden glass border-l-4 border-red-500 p-4 rounded-xl text-red-400 font-semibold flex justify-between items-center">
      <span id="alertMessage">⚠️ LANDSLIDE RISK DETECTED!</span>
      <span class="text-xs text-slate-400">Telegram Notification Triggered</span>
    </div>

    <!-- Live Telemetry Gauges -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="glass p-6 rounded-xl flex flex-col items-center">
        <h3 class="text-lg font-medium text-slate-300 mb-4">Soil Moisture Saturation (%)</h3>
        <div id="gauge_moisture"></div>
        <p id="moistureValue" class="text-3xl font-bold text-sky-400 mt-2">-- %</p>
      </div>

      <div class="glass p-6 rounded-xl flex flex-col items-center">
        <h3 class="text-lg font-medium text-slate-300 mb-4">Ground Tilt Angle (°)</h3>
        <div id="gauge_tilt"></div>
        <p id="tiltValue" class="text-3xl font-bold text-emerald-400 mt-2">-- °</p>
      </div>
    </div>

    <!-- ThingSpeak Dynamic Telemetry Chart -->
    <div class="glass p-6 rounded-xl">
      <h3 class="text-lg font-medium text-slate-300 mb-4">Live Channel Telemetry Feed</h3>
      <iframe class="w-full h-80 rounded-lg border border-slate-700" src="https://thingspeak.com/channels/3474434/charts/1?bgcolor=%231e293b&color=%2338bdf8&dynamic=true&type=line"></iframe>
    </div>

  </div>

  <script>
    const CHANNEL_ID = '3474434';
    const READ_API_KEY = 'HGQU6VE5X73Q0K8N';
    const BOT_TOKEN = '8893728146:AAHWfrIVJ4vVHct7YzL1sRPErGK8thf28Ew';
    const CHAT_ID = 'YOUR_TELEGRAM_CHAT_ID'; 

    let moistureGauge, tiltGauge;
    let alertSent = false;

    google.charts.load('current', {'packages':['gauge']});
    google.charts.setOnLoadCallback(initGauges);

    function initGauges() {
      const optionsMoisture = { width: 200, height: 200, redFrom: 80, redTo: 100, yellowFrom: 60, yellowTo: 80, minorTicks: 5, max: 100 };
      const optionsTilt = { width: 200, height: 200, redFrom: 45, redTo: 90, yellowFrom: 25, yellowTo: 45, minorTicks: 5, max: 90 };

      moistureGauge = new google.visualization.Gauge(document.getElementById('gauge_moisture'));
      tiltGauge = new google.visualization.Gauge(document.getElementById('gauge_tilt'));

      moistureGauge.draw(google.visualization.arrayToDataTable([['Label', 'Value'], ['Moisture', 0]]), optionsMoisture);
      tiltGauge.draw(google.visualization.arrayToDataTable([['Label', 'Value'], ['Tilt', 0]]), optionsTilt);

      fetchThingSpeakData();
      setInterval(fetchThingSpeakData, 15000);
    }

    async function fetchThingSpeakData() {
      try {
        const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?api_key=${READ_API_KEY}`);
        const data = await response.json();

        const moisture = parseFloat(data.field1) || 0;
        const tilt = parseFloat(data.field2) || 0;

        document.getElementById('moistureValue').innerText = moisture + ' %';
        document.getElementById('tiltValue').innerText = tilt + ' °';

        moistureGauge.draw(google.visualization.arrayToDataTable([['Label', 'Value'], ['Moisture', moisture]]), { width: 200, height: 200, redFrom: 80, redTo: 100, max: 100 });
        tiltGauge.draw(google.visualization.arrayToDataTable([['Label', 'Value'], ['Tilt', tilt]]), { width: 200, height: 200, redFrom: 45, redTo: 90, max: 90 });

        checkThresholds(moisture, tilt);
      } catch (err) {
        console.error("Telemetry update error:", err);
      }
    }

    function checkThresholds(moisture, tilt) {
      const banner = document.getElementById('alertBanner');
      if (moisture > 80 || tilt > 45) {
        banner.classList.remove('hidden');
        if (!alertSent) {
          sendTelegramAlert(moisture, tilt);
          alertSent = true;
        }
      } else {
        banner.classList.add('hidden');
        alertSent = false;
      }
    }

    function sendTelegramAlert(moisture, tilt) {
      if (CHAT_ID === 'YOUR_TELEGRAM_CHAT_ID') return;
      const text = `⚠️ *TerraWatch Alert* %0AMoisture: ${moisture}%25%0ATilt Angle: ${tilt}°`;
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}&parse_mode=Markdown`);
    }
  </script>
</body>
</html>
