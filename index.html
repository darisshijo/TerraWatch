<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraWatch Pro - Landslide Early Warning System</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Chart.js & Google Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
    }

    .alert-banner {
      border-radius: 12px;
      padding: 16px;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .gauge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .metric-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
    }

    .status-dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .bg-safe { background-color: var(--accent-green); }
    .bg-warn { background-color: var(--accent-yellow); }
    .bg-danger-custom { background-color: var(--accent-red); }
  </style>
</head>
<body>

  <!-- Navbar Header -->
  <nav class="navbar navbar-dark my-3">
    <div class="container glass-card py-2 px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="bi bi-shield-exclamation text-info fs-3"></i>
        <span class="brand-title fs-3">TERRAWATCH PRO</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-secondary p-2"><span class="status-dot bg-safe" id="live-dot"></span> LIVE TELEMETRY</span>
        <small class="text-secondary d-none d-md-inline" id="last-updated">Updating...</small>
      </div>
    </div>
  </nav>

  <div class="container">
    
    <!-- Dynamic Alert Status Banner -->
    <div class="row mb-4">
      <div class="col-12">
        <div id="alert-banner" class="alert-banner bg-success text-white glass-card d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <i id="alert-icon" class="bi bi-check-circle-fill fs-2"></i>
            <div>
              <div class="text-uppercase small opacity-75 fw-bold">System Status</div>
              <div id="alert-text" class="fs-5">✅ SYSTEM NORMAL: PARAMETERS STABLE</div>
            </div>
          </div>
          <div class="text-end d-none d-sm-block">
            <span class="badge bg-dark opacity-75 fs-6">Node: Alpha-1</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Real-time Sensor Gauges & Metrics -->
    <div class="row g-4 mb-4">
      
      <!-- Ground Tilt Meter (MPU6050) -->
      <div class="col-md-6 col-lg-6">
        <div class="glass-card p-4 h-100 text-center">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-info m-0"><i class="bi bi-compass me-2"></i>Ground Tilt Angle</h5>
            <span class="badge bg-dark text-info">Threshold: 35°</span>
          </div>
          <div class="gauge-container">
            <div id="tilt_gauge"></div>
          </div>
          <div class="mt-3">
            <span class="text-secondary">Current Angle:</span>
            <span id="tilt-val" class="metric-value text-white ms-2">0.0°</span>
          </div>
        </div>
      </div>

      <!-- Soil Moisture Meter (YL-69) -->
      <div class="col-md-6 col-lg-6">
        <div class="glass-card p-4 h-100 text-center">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-info m-0"><i class="bi bi-droplet-half me-2"></i>Soil Moisture Saturation</h5>
            <span class="badge bg-dark text-info">Threshold: 70%</span>
          </div>
          <div class="gauge-container">
            <div id="moisture_gauge"></div>
          </div>
          <div class="mt-3">
            <span class="text-secondary">Current Saturation:</span>
            <span id="moisture-val" class="metric-value text-white ms-2">0.0%</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Live Telemetry Graph -->
    <div class="row">
      <div class="col-12">
        <div class="glass-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="text-info m-0"><i class="bi bi-graph-up-arrow me-2"></i>Real-time Telemetry Analytics</h5>
            <span class="text-secondary small">Channel ID: 3474434</span>
          </div>
          <div style="position: relative; height: 320px; width: 100%;">
            <canvas id="telemetryChart"></canvas>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript Code Section -->
  <script>
    // Load Google Gauges Package
    google.charts.load('current', {'packages':['gauge']});
    google.charts.setOnLoadCallback(initGauges);

    let tiltGauge, moistureGauge, gaugeData;
    let telemetryChart;
    const CHANNEL_ID = '3474434';
    const READ_API_URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=15`;

    // Initialize Google Gauges
    function initGauges() {
      gaugeData = new google.visualization.DataTable();
      gaugeData.addColumn('string', 'Label');
      gaugeData.addColumn('number', 'Value');
      gaugeData.addRows([
        ['Tilt (°)', 0],
        ['Moisture (%)', 0]
      ]);

      // Gauge configuration: Red Alert at >= 35° Tilt and >= 70% Moisture
      const tiltOptions = {
        width: 180, height: 180,
        redFrom: 35, redTo: 90,        // RED ALERT at >= 35°
        yellowFrom: 15, yellowTo: 35,  // WARNING at 15°-35°
        minorTicks: 5, max: 90
      };

      const moistureOptions = {
        width: 180, height: 180,
        redFrom: 70, redTo: 100,       // RED ALERT at >= 70%
        yellowFrom: 50, yellowTo: 70,  // WARNING at 50%-70%
        minorTicks: 5, max: 100
      };

      tiltGauge = new google.visualization.Gauge(document.getElementById('tilt_gauge'));
      moistureGauge = new google.visualization.Gauge(document.getElementById('moisture_gauge'));

      tiltGauge.draw(gaugeData, tiltOptions);
      moistureGauge.draw(gaugeData, moistureOptions);

      // Initialize Chart after Gauges ready
      initChart();
      fetchTelemetryData();
      setInterval(fetchTelemetryData, 15000); // Auto-refresh every 15 seconds
    }

    // Initialize Chart.js Analytics
    function initChart() {
      const ctx = document.getElementById('telemetryChart').getContext('2d');
      telemetryChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'Tilt Angle (°)',
              data: [],
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              borderWidth: 2,
              fill: true,
              tension: 0.3
            },
            {
              label: 'Soil Moisture (%)',
              data: [],
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              borderWidth: 2,
              fill: true,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#cbd5e1' } }
          },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true, max: 100 }
          }
        }
      });
    }

    // Fetch live feed from ThingSpeak
    async function fetchTelemetryData() {
      try {
        const response = await fetch(READ_API_URL);
        const data = await response.json();
        const feeds = data.feeds;

        if (feeds && feeds.length > 0) {
          const latestFeed = feeds[feeds.length - 1];
          const latestTilt = parseFloat(latestFeed.field1) || 0;
          const latestMoisture = parseFloat(latestFeed.field2) || 0;

          // Update Gauges & UI Labels
          gaugeData.setValue(0, 1, latestTilt);
          gaugeData.setValue(1, 1, latestMoisture);
          
          document.getElementById('tilt-val').innerText = latestTilt.toFixed(1) + '°';
          document.getElementById('moisture-val').innerText = latestMoisture.toFixed(1) + '%';

          // Evaluate Threshold Alert Rules
          evaluateAlerts(latestTilt, latestMoisture);

          // Update Chart
          const labels = feeds.map(f => new Date(f.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          const tiltPoints = feeds.map(f => parseFloat(f.field1) || 0);
          const moisturePoints = feeds.map(f => parseFloat(f.field2) || 0);

          telemetryChart.data.labels = labels;
          telemetryChart.data.datasets[0].data = tiltPoints;
          telemetryChart.data.datasets[1].data = moisturePoints;
          telemetryChart.update();

          document.getElementById('last-updated').innerText = 'Last updated: ' + new Date().toLocaleTimeString();
        }
      } catch (err) {
        console.error('Telemetry fetch error:', err);
      }
    }

    // Dynamic Threshold Alert Handler
    function evaluateAlerts(tilt, moisture) {
      const alertBanner = document.getElementById('alert-banner');
      const alertText = document.getElementById('alert-text');
      const alertIcon = document.getElementById('alert-icon');
      const liveDot = document.getElementById('live-dot');

      // CRITICAL RED ALERT: Tilt >= 35° OR Moisture >= 70%
      if (tilt >= 35 || moisture >= 70) {
        alertBanner.className = 'alert-banner bg-danger text-white glass-card d-flex align-items-center justify-content-between';
        alertText.innerHTML = '🚨 CRITICAL ALERT: HIGH LANDSLIDE THREAT DETECTED!';
        alertIcon.className = 'bi bi-exclamation-triangle-fill fs-2';
        liveDot.className = 'status-dot bg-danger-custom';
      } 
      // MODERATE YELLOW WARNING: Tilt >= 15° OR Moisture >= 50%
      else if (tilt >= 15 || moisture >= 50) {
        alertBanner.className = 'alert-banner bg-warning text-dark glass-card d-flex align-items-center justify-content-between';
        alertText.innerHTML = '⚠️ WARNING: ELEVATED GROUND TILT / MOISTURE DETECTED';
        alertIcon.className = 'bi bi-exclamation-circle-fill fs-2';
        liveDot.className = 'status-dot bg-warn';
      } 
      // SAFE GREEN STATE
      else {
        alertBanner.className = 'alert-banner bg-success text-white glass-card d-flex align-items-center justify-content-between';
        alertText.innerHTML = '✅ SYSTEM NORMAL: ALL PARAMETERS STABLE';
        alertIcon.className = 'bi bi-check-circle-fill fs-2';
        liveDot.className = 'status-dot bg-safe';
      }
    }
  </script>
</body>
</html>
