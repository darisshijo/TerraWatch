<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraWatch Pro - Advanced Landslide Telemetry</title>
  <!-- Google Fonts for professional typography -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Gauge Chart Library -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    :root {
      --bg-dark: #070a13;
      --card-bg: rgba(25, 32, 50, 0.7);
      --text-main: #f1f5f9;
      --primary: #00f2fe; /* Cyber Blue */
      --secondary: #4facfe;
      --warning: #ff0055; /* Neon Red */
      --safe: #00ff88;    /* Neon Green */
      --border: rgba(255, 255, 255, 0.08);
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(255, 0, 85, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Professional Header */
    .header-panel {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 0;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .brand-id { font-family: 'Orbitron', sans-serif; font-weight: 700; color: var(--primary); letter-spacing: 1px; }

    /* Elegant Glassmorphism Cards */
    .card-pro {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .card-pro:hover {
      transform: translateY(-5px);
      border-color: rgba(79, 172, 254, 0.3);
      box-shadow: 0 12px 40px 0 rgba(79, 172, 254, 0.15);
    }

    .metric-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; font-weight: 600; }
    .metric-value { font-family: 'Orbitron', sans-serif; font-size: 3.2rem; font-weight: 700; margin: 10px 0; }
    .unit { font-size: 1.2rem; color: #94a3b8; font-family: 'Poppins', sans-serif; font-weight: 300; }

    /* Dynamic Status Banner */
    .status-banner {
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 15px;
      text-align: center;
      margin-bottom: 30px;
      transition: all 0.5s ease;
    }

    .stat-safe {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--safe);
      color: var(--safe);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }

    .stat-war {
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--warning);
      color: var(--warning);
      animation: pulseAlert 1.5s infinite;
    }

    /* Gauge Container */
    .gauge-holder { width: 100%; height: 120px; display: flex; justify-content: center; align-items: center; margin-top: -15px; }

    @keyframes pulseAlert {
      0% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); opacity: 1; }
      50% { box-shadow: 0 0 25px rgba(255, 0, 85, 0.5); opacity: 0.8; }
      100% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="header-panel">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <h3 class="m-0 brand-id">TERRAWATCH <span style="font-weight:300;color:#94a3b8">PRO</span></h3>
        <small class="text-muted" style="font-size:0.8rem">Landslide Detection Node | ESP32-Telemetry</small>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="dot" id="syncDot" style="height:10px;width:10px;background:#94a3b8;border-radius:50%;display:inline-block"></span>
        <span class="text-muted" style="font-size:0.85rem" id="lastUpdated">Initializing...</span>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    
    <!-- System Status Banner -->
    <div id="statusBanner" class="status-banner stat-safe">
      SYSTEM STATUS: MONITORING ACTIVE
    </div>

    <!-- Metrics Row (Soil & Tilt) -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="card-pro text-center">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="metric-title">Soil Moisture</span>
            <span class="badge bg-dark text-muted" style="border:1px solid #334155">LIMIT: 73%</span>
          </div>
          <div class="gauge-holder" id="soilGauge"></div>
          <div class="metric-value" style="color:var(--secondary)" id="soilVal">-- <span class="unit">%</span></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card-pro text-center">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="metric-title">Ground Displacement</span>
            <span class="badge bg-dark text-muted" style="border:1px solid #334155">LIMIT: 3.0</span>
          </div>
          <div class="gauge-holder" id="tiltGauge"></div>
          <div class="metric-value" style="color:#facc15" id="tiltVal">-- <span class="unit">m/s²</span></div>
        </div>
      </div>
    </div>

    <!-- Trend Chart -->
    <div class="row">
      <div class="col-12">
        <div class="card-pro">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0" style="font-weight:600;letter-spacing:0.5px">Real-Time Telemetry Trend (Last 10 Reads)</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="fetchThingSpeakData()" style="font-size:0.75rem;border-color:#334155">FORCE REFRESH</button>
          </div>
          <div style="height: 250px;">
            <canvas id="telemetryChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CHANNEL_ID = '3474434';
    const FETCH_INTERVAL = 15000; // ThingSpeak free tier limit is ~15s
    const SOIL_THRESHOLD = 73;
    const TILT_THRESHOLD = 3.0;

    let chart;
    let soilGauge, tiltGauge;
    let soilGaugeData, tiltGaugeData;

    // Load Google Gauges
    google.charts.load('current', {'packages':['gauge']});
    google.charts.setOnLoadCallback(initGauges);

    function initGauges() {
      soilGaugeData = google.visualization.arrayToDataTable([['Label', 'Value'],['Moisture', 0]]);
      tiltGaugeData = google.visualization.arrayToDataTable([['Label', 'Value'],['Tilt', 0]]);

      const commonOptions = {
        min: 0, 
        minorTicks: 5,
        yellowColor: '#facc15', redColor: '#ff0055',
        bgColor: 'transparent'
      };

      const soilOptions = {...commonOptions, max: 100, yellowFrom: 60, yellowTo: 73, redFrom: 73, redTo: 100};
      const tiltOptions = {...commonOptions, max: 10, yellowFrom: 2.0, yellowTo: 3.0, redFrom: 3.0, redTo: 10};

      soilGauge = new google.visualization.Gauge(document.getElementById('soilGauge'));
      tiltGauge = new google.visualization.Gauge(document.getElementById('tiltGauge'));

      soilGauge.draw(soilGaugeData, soilOptions);
      tiltGauge.draw(tiltGaugeData, tiltOptions);
    }

    function initChart() {
      const ctx = document.getElementById('telemetryChart').getContext('2d');
      
      // Create gradients for the lines
      const blueGrad = ctx.createLinearGradient(0, 0, 0, 250);
      blueGrad.addColorStop(0, 'rgba(0, 242, 254, 0.4)');
      blueGrad.addColorStop(1, 'rgba(0, 242, 254, 0)');

      const yellowGrad = ctx.createLinearGradient(0, 0, 0, 250);
      yellowGrad.addColorStop(0, 'rgba(250, 204, 21, 0.2)');
      yellowGrad.addColorStop(1, 'rgba(250, 204, 21, 0)');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'Soil Moisture (%)',
            borderColor: '#00f2fe',
            backgroundColor: blueGrad,
            fill: true,
            tension: 0.4,
            borderWidth: 3,
            pointRadius: 2,
            data: []
          },
          {
            label: 'Tilt Delta (m/s²)',
            borderColor: '#facc15',
            backgroundColor: yellowGrad,
            fill: true,
            tension: 0.4,
            borderWidth: 3,
            pointRadius: 2,
            data: []
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc', font: { family: 'Poppins' } } }
          },
          scales: {
            x: { ticks: { color: '#64748b' }, grid: { display: false } },
            y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.03)' } }
          }
        }
      });
    }

    async function fetchThingSpeakData() {
      const syncDot = document.getElementById('syncDot');
      syncDot.style.background = '#00f2fe'; // Visual sync pulse

      try {
        const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=10`);
        const data = await response.json();
        const feeds = data.feeds;

        if (feeds && feeds.length > 0) {
          const latest = feeds[feeds.length - 1];
          const soil = parseFloat(latest.field1) || 0;
          const tilt = parseFloat(latest.field2) || 0;
          const timestamp = new Date(latest.created_at).toLocaleTimeString();

          // Update Values
          document.getElementById('soilVal').innerHTML = `${soil.toFixed(1)} <span class="unit">%</span>`;
          document.getElementById('tiltVal').innerHTML = `${tilt.toFixed(2)} <span class="unit">m/s²</span>`;
          document.getElementById('lastUpdated').innerText = 'Last Sync: ' + timestamp;

          // Update Gauges
          if(soilGauge) {
            soilGaugeData.setValue(0, 1, soil);
            soilGauge.draw(soilGaugeData, {max: 100, yellowFrom: 60, yellowTo: 73, redFrom: 73, redTo: 100, yellowColor: '#facc15', redColor: '#ff0055'});
          }
          if(tiltGauge) {
            tiltGaugeData.setValue(0, 1, tilt);
            tiltGauge.draw(tiltGaugeData, {max: 10, yellowFrom: 2.0, yellowTo: 3.0, redFrom: 3.0, redTo: 10, yellowColor: '#facc15', redColor: '#ff0055'});
          }

          // Update Status Banner
          const banner = document.getElementById('statusBanner');
          if (soil > SOIL_THRESHOLD && tilt > TILT_THRESHOLD) {
            banner.className = 'status-banner stat-war';
            banner.innerText = '⚠️ CRITICAL: LANDSLIDE RISK DETECTED';
          } else {
            banner.className = 'status-banner stat-safe';
            banner.innerText = 'SYSTEM STATUS: MONITORING ACTIVE (NORMAL)';
          }

          // Update Chart
          chart.data.labels = feeds.map(f => new Date(f.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          chart.data.datasets[0].data = feeds.map(f => parseFloat(f.field1) || 0);
          chart.data.datasets[1].data = feeds.map(f => parseFloat(f.field2) || 0);
          chart.update('none'); // Update without animation for performance
        }
      } catch (err) {
        console.error('Fetch error:', err);
      } finally {
        setTimeout(() => syncDot.style.background = '#94a3b8', 500); // Reset pulse
      }
    }

    window.onload = () => {
      initChart();
      fetchThingSpeakData();
      setInterval(fetchThingSpeakData, FETCH_INTERVAL);
    };
  </script>
</body>
</html>
